service: taller-products
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'local'}
  region: us-east-1
  timeout: 30
  apiGateway:
    restApiId: !ImportValue MainRestApiId
    restApiRootResourceId: !ImportValue MainRestApiRootResourceId
  environment:
    PRODUCTS_TABLE: !Ref ProductsTable
    STAGE: ${self:provider.stage}
    CORS_ORIGINS: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt ProductsTable.Arn
            - !Sub "${ProductsTable.Arn}/index/*"
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:taller-notify-${self:provider.stage}-*"

plugins:
  - serverless-localstack
  - serverless-offline

custom:
  localstack:
    stages: [local]
    host: http://localhost
    edgePort: 4566
    autostart: false

build:
  esbuild:
    bundle: true
    sourcemap: true
    target: node22

functions:
  listAllProducts:
    handler: src/handlers/listAllProducts.listAllProducts
    events:
      - http:
          method: get
          path: /products
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  getProduct:
    handler: src/handlers/getProduct.getProduct
    events:
      - http:
          method: get
          path: /products/{id}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  listProductsBySeller:
    handler: src/handlers/listProductsBySeller.listProductsBySeller
    events:
      - http:
          method: get
          path: /products/users/{sellerId}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  createProduct:
    handler: src/handlers/createProduct.createProduct
    events:
      - http:
          method: post
          path: /products
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  updateProduct:
    handler: src/handlers/updateProduct.updateProduct
    events:
      - http:
          method: put
          path: /products/{id}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  deleteProduct:
    handler: src/handlers/deleteProduct.deleteProduct
    events:
      - http:
          method: delete
          path: /products/{id}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  updateStock:
    handler: src/handlers/updateStock.updateStock
    events:
      - http:
          method: patch
          path: /products/{id}/stock
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-products
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
          - AttributeName: sellerId
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: SellerIndex
            KeySchema:
              - AttributeName: sellerId
                KeyType: HASH
            Projection:
              ProjectionType: ALL