service: taller-users
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'local'}
  region: us-east-1
  apiGateway:
    restApiId: !ImportValue MainRestApiId
    restApiRootResourceId: !ImportValue MainRestApiRootResourceId
  environment:
    USERS_TABLE: !Ref UsersTable
    REFRESH_TOKENS_TABLE: !Ref RefreshTokensTable
    JWT_SECRET: ${env:JWT_SECRET, 'local-dev-secret'}
    JWT_REFRESH_SECRET: ${env:JWT_REFRESH_SECRET, 'local-dev-refresh-secret'}
    STAGE: ${self:provider.stage}
    CORS_ORIGINS: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
      Resource:
        - !GetAtt UsersTable.Arn
        - !Sub "${UsersTable.Arn}/index/*"
        - !GetAtt RefreshTokensTable.Arn

plugins:
  - serverless-localstack
  - serverless-offline

custom:
  localstack:
    stages: [local]
    host: http://localhost
    edgePort: 4566
    autostart: false

build:
  esbuild:
    bundle: true
    sourcemap: true
    target: node22

functions:
  register:
    handler: src/handlers/register.register
    events:
      - http:
          method: post
          path: /users/register
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  login:
    handler: src/handlers/login.login
    events:
      - http:
          method: post
          path: /users/login
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  refreshToken:
    handler: src/handlers/refreshToken.refreshToken
    events:
      - http:
          method: post
          path: /users/refresh
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  getUser:
    handler: src/handlers/getUser.getUser
    events:
      - http:
          method: get
          path: /users/{id}
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  updateUser:
    handler: src/handlers/updateUser.updateUser
    events:
      - http:
          method: put
          path: /users/{id}
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  deleteUser:
    handler: src/handlers/deleteUser.deleteUser
    events:
      - http:
          method: delete
          path: /users/{id}
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    RefreshTokensTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-refresh-tokens
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: token
            AttributeType: S
        KeySchema:
          - AttributeName: token
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true