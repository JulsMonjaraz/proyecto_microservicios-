service: taller-orders
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'local'}
  region: us-east-1
  timeout: 30
  apiGateway:
    restApiId: !ImportValue MainRestApiId
    restApiRootResourceId: !ImportValue MainRestApiRootResourceId
  environment:
    ORDERS_TABLE: !Ref OrdersTable
    STAGE: ${self:provider.stage}
    CORS_ORIGINS: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGINS}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt OrdersTable.Arn
            - !Sub "${OrdersTable.Arn}/index/*"
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:taller-products-${self:provider.stage}-*"
            - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:taller-notify-${self:provider.stage}-*"

plugins:
  - serverless-localstack
  - serverless-offline

custom:
  localstack:
    stages: [local]
    host: http://localhost
    edgePort: 4566
    autostart: false

build:
  esbuild:
    bundle: true
    sourcemap: true
    target: node22

functions:
  createOrder:
    handler: src/handlers/createOrder.createOrder
    events:
      - http:
          method: post
          path: /orders
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  getOrder:
    handler: src/handlers/getOrder.getOrder
    events:
      - http:
          method: get
          path: /orders/{id}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  listOrders:
    handler: src/handlers/listOrders.listOrders
    events:
      - http:
          method: get
          path: /orders/users/{userId}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  listOrdersBySeller:
    handler: src/handlers/listOrdersBySeller.listOrdersBySeller
    events:
      - http:
          method: get
          path: /orders/seller/{sellerId}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  confirmOrder:
    handler: src/handlers/confirmOrder.confirmOrder
    events:
      - http:
          method: post
          path: /orders/{id}/confirm
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

  cancelOrder:
    handler: src/handlers/cancelOrder.cancelOrder
    events:
      - http:
          method: post
          path: /orders/{id}/cancel
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token
          authorizer:
            type: CUSTOM
            authorizerId: !ImportValue MainAuthorizerId

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserOrdersIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

